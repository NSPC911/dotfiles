# yaml-language-server: $schema=https://raw.githubusercontent.com/amnweb/yasb/main/schema.json
watch_stylesheet: true
watch_config: true
debug: true
bars:
  primary-bar:
    enabled: true
    screens: ["*"]
    class_name: "yasb-bar"
    alignment:
      position: "bottom"
      align: "center"
    animation:
      enabled: false
      duration: 1000
    blur_effect:
      enabled: false
      dark_mode: true
      round_corners: true
      round_corners_type: "normal"
      border_color: "none"
    window_flags:
      always_on_top: true
      windows_app_bar: true
      hide_on_fullscreen: false
    dimensions:
      width: "100%"
      height: 31
    padding:
      top: 0
      right: 2
      bottom: 4
      left: 2
    widgets:
      left: [
          "power_menu",
          "launchpad",
          "media-controls",
          "glazewm_workspaces",
          "taskbar",
          # "active_window"
        ]
      center: ["clock", "cpu"]
      right:
        [
          # "glazewm_tiling_direction",
          "systray",
          "toggle_keyboard",
          "bluetooth",
          "wifi",
          "brightness",
          "volume",
          "battery",
          "notifications",
        ]
widgets:
  active_window:
    type: "yasb.active_window.ActiveWindowWidget"
    options:
      label: "{win[title]}"
      label_alt: "{win[process][name]} ({win[hwnd]})"
      label_no_window: " "
      label_icon: true
      label_icon_size: 14
      max_length: 35
      max_length_ellipsis: "-"
      monitor_exclusive: false
      callbacks:
        on_left: "toggle_label"
  battery:
    type: "yasb.battery.BatteryWidget"
    options:
      label: "<span>{icon}</span>{percent}%"
      label_alt: "{icon} {percent}% | time: {time_remaining}"
      callbacks:
        on_right: "exec cmd.exe /c start ms-settings:batterysaver-usagedetails"
        on_middle: "do_nothing"
        on_left: "toggle_label"
      status_thresholds:
        critical: 6
        low: 30
        medium: 60
        high: 80
        full: 100
      status_icons:
        icon_charging: "\uf0e7"
        icon_critical: "\uf244"
        icon_low: "\uf243"
        icon_medium: "\uf242"
        icon_high: "\uf241"
        icon_full: "\uf240"
      charging_options:
        icon_format: "{charging_icon}"
  bluetooth:
    type: "yasb.bluetooth.BluetoothWidget"
    options:
      label: "<span>{icon}</span>"
      label_alt: "<span>{icon}</span> {device_name}"
      icons:
        bluetooth_on: "\udb80\udcaf"
        bluetooth_off: "\udb80\udcb2"
        bluetooth_connected: "\udb80\udcb1"
      callbacks:
        on_left: "do_nothing"
        on_right: "exec cmd.exe /c start ms-settings:bluetooth"
  brightness:
    type: "yasb.brightness.BrightnessWidget"
    options:
      label: "<span>{icon}</span>"
      label_alt: "<span>{icon}</span> {percent}%"
      tooltip: false
      invert_wheel: true
      brightness_toggle_level: [0, 50, 100]
      auto_light: false
      auto_light_icon: "\udb80\udce1"
      auto_light_night_level: 35
      auto_light_night_start_time: "19:00"
      auto_light_night_end_time: "06:45"
      auto_light_day_level: 75
      brightness_icons: ["\udb80\udcde", "\udb80\udcdd", "\udb80\udcdf", "\udb80\udce0"]
      brightness_menu:
        blur: true
        round_corners: true
        round_corners_type: "normal"
        border_color: "System"
        alignment: "right"
        direction: "down"
      callbacks:
        on_left: "toggle_brightness_menu"
        on_middle: "toggle_level_next"
        on_right: "exec cmd.exe /c start ms-settings:display"
  cava:
    type: "yasb.cava.CavaWidget"
    options:
      bar_height: 36
      min_bar_height: 0
      gradient: 1
      reverse: 0
      foreground: "#88C0D0"
      bars_number: 8
      gradient_color_1: "#8FBCBB"
      gradient_color_2: "#81A1C1"
      gradient_color_3: "#5E81AC"
      bar_spacing: 6
      bar_width: 14
      sleep_timer: 1
      hide_empty: false
  clock:
    type: "yasb.clock.ClockWidget"
    options:
      label: "{%a %d %b %H:%M:%S}"
      label_alt: "{%A %d %B %Y, %H:%M:%S}"
      timezones: []
      calendar:
        blur: true
        round_corners: true
        alignment: "center"
        direction: "up"
        offset_top: 5
        offset_left: 0
      callbacks:
        on_left: "toggle_calendar"
        on_middle: "next_timezone"
        on_right: "toggle_label"
  cpu:
    type: "yasb.cpu.CpuWidget"
    options:
      label: "<span>\uf4bc</span> {info[percent][total]}%"
      label_alt: "<span>\uf437</span> {info[histograms][cpu_percent]}"
      update_interval: 1000
      histogram_icons:
        - "\u2581" # 0%
        - "\u2581" # 10%
        - "\u2582" # 20%
        - "\u2583" # 30%
        - "\u2584" # 40%
        - "\u2585" # 50%
        - "\u2586" # 60%
        - "\u2587" # 70%
        - "\u2588" # 80%+
      histogram_num_columns: 8
      callbacks:
        on_right: "do_nothing"
        on_middle: "reload_cava"
  glazewm_tiling_direction:
    type: "glazewm.tiling_direction.GlazewmTilingDirectionWidget"
    options:
      horizontal_label: "\udb81\udce1"
      vertical_label: "\udb81\udce2"
      btn_shadow:
        enabled: false
        color: "black"
        radius: 3
        offset: [1, 1]
  glazewm_workspaces:
    type: "glazewm.workspaces.GlazewmWorkspacesWidget"
    options:
      offline_label: " "
      monitor_exclusive: false
      hide_if_offline: true
      enable_scroll_switching: false
      populated_label: " "
      empty_label: " "
      active_populated_label: " "
      active_empty_label: " "
  launchpad:
    type: "yasb.launchpad.LaunchpadWidget"
    options:
      label: "<span>\udb85\udcde</span>"
      search_placeholder: "Search apps..."
      app_icon_size: 48
      window:
        fullscreen: false
        width: 800
        height: 600
        overlay_block: true
      window_style:
        enable_blur: true
        round_corners: true
        round_corners_type: "normal"
        border_color: "system"
      window_animation:
        fade_in_duration: 125
        fade_out_duration: 125
      callbacks:
        on_left: "toggle_launchpad"
      keybindings:
        - keys: "ctrl+alt+shift+f24"
          action: "toggle_launchpad"
  media-controls:
    type: "yasb.media.MediaWidget"
    options:
      label: " {title} "
      label_alt: " {artist} "
      hide_empty: true
      callbacks:
        on_left: "toggle_media_menu"
        on_right: "toggle_label"
        on_middle: "do_nothing"
      max_field_size:
        label: 35
        label_alt: 35
      show_thumbnail: false
      controls_only: true
      controls_left: false
      controls_hide: false
      thumbnail_alpha: 127
      thumbnail_padding: 0
      thumbnail_corner_radius: 0
      icons:
        prev_track: "\ue892"
        next_track: "\ue893"
        play: "\ue768"
        pause: "\ue769"
      media_menu:
        blur: true
        round_corners: true
        round_corners_type: "normal"
        border_color: "system"
        alignment: "center"
        direction: "down"
        offset_top: 7
        offset_left: 0
        thumbnail_corner_radius: 8
        thumbnail_size: 120
        max_title_size: 80
        max_artist_size: 20
        show_source: false
      media_menu_icons:
        play: "\ue768"
        pause: "\ue769"
        prev_track: "\ue892"
        next_track: "\ue893"
  media-info:
    type: "yasb.media.MediaWidget"
    options:
      label: " {title} - {artist} "
      label_alt: " {title} - {artist} "
      hide_empty: true
      callbacks:
        on_left: "toggle_media_menu"
        on_right: "toggle_label"
        on_middle: "do_nothing"
      max_field_size:
        label: 48
        label_alt: 48
      show_thumbnail: true
      controls_only: false
      controls_left: false
      controls_hide: true
      thumbnail_alpha: 127
      thumbnail_padding: 0
      thumbnail_corner_radius: 0
      icons:
        prev_track: "\ue892"
        next_track: "\ue893"
        play: "\ue768"
        pause: "\ue769"
      media_menu:
        blur: true
        round_corners: true
        round_corners_type: "normal"
        border_color: "system"
        alignment: "center"
        direction: "down"
        offset_top: 7
        offset_left: 0
        thumbnail_corner_radius: 8
        thumbnail_size: 120
        max_title_size: 80
        max_artist_size: 20
        show_source: false
      media_menu_icons:
        play: "\ue768"
        pause: "\ue769"
        prev_track: "\ue892"
        next_track: "\ue893"
  notifications:
    type: "yasb.notifications.NotificationsWidget"
    options:
      label: "<span>{icon}</span> "
      label_alt: "<span>{icon}</span> {count} "
      hide_empty: false
      tooltip: true
      icons:
        new: "\U000f116b"
        default: "\U000f009a"
      callbacks:
        on_left: "toggle_notification"
        on_right: "toggle_label"
        on_middle: "do_nothing"
  power_menu:
    type: "yasb.power_menu.PowerMenuWidget"
    options:
      label: "\u23fb"
      uptime: True
      blur: False
      blur_background: True
      animation_duration: 125
      button_row: 5
      buttons:
        shutdown: ["\u23fb", "Shut Down"]
        restart: ["\uead2", "Restart"]
        hibernate: ["\uf28e", "Hibernate"]
        sleep: ["\u23fe", "Sleep"]
        signout: ["\udb80\udf43", "Sign out"]
        cancel: ["", "Cancel"]
      keybindings:
        - keys: "win+shift+l"
          action: "toggle_power_menu"
  systray:
    type: "yasb.systray.SystrayWidget"
    options:
      class_name: "systray"
      label_collapsed: "\uf078"
      label_expanded: "\uf054"
      label_position: "left"
      icon_size: 16
      pin_click_modifier: "alt"
      show_unpinned: false
      show_unpinned_button: true
      show_battery: false
      show_volume: false
      show_network: false
      show_in_popup: true
      use_hook: false
      hide_icons: []
      popup:
        blur: true
        round_corners: true
        round_corners_type: "normal"
        border_color: None
        alignment: "center"
        direction: "up"
        offset_top: 6
        offset_left: 0
  toggle_keyboard:
    type: "yasb.custom.CustomWidget"
    options:
      label: "\uf11c"
      class_name: "toggle-keyboard"
      tooltip: false
      callbacks:
        on_left: 'exec uvx --with git+https://github.com/amnweb/yasb python -c "from core.widgets.services.control_center.api.keyboard import TouchKeyboardService;TouchKeyboardService.toggle()"'
  taskbar:
    type: "yasb.taskbar.TaskbarWidget"
    options:
      icon_size: 16
      tooltip: true
      show_only_visible: true
      strict_filtering: true
      monitor_exclusive: false
      animation:
        enabled: false
        duration: 200
      preview:
        enabled: true
        width: 240
        delay: 400
        padding: 8
        margin: 8
      title_label:
        enabled: false
        show: "always"
        min_length: 10
        max_length: 30
      ignore_apps:
        processes: []
        titles: []
        classes: []
  volume:
    type: "yasb.volume.VolumeWidget"
    options:
      label: "<span>{icon}</span> {level}"
      label_alt: "{volume}"
      tooltip: true
      invert_wheel: true
      mute_text: "0%"
    audio_menu:
      blur: true
      round_corners: true
      round_corners_type: "normal"
      border_color: "system"
      alignment: "right"
      direction: "down"
      offset_top: 6
      offset_left: 0
      show_apps: true
      show_app_labels: false
      show_app_icons: true
      show_apps_expanded: false
      app_icons:
        toggle_down: "\uf078"
        toggle_up: "\uf077"
      volume_icons:
        - "\ueee8"
        - "\uf026"
        - "\uf027"
        - "\uf027"
        - "\uf028"
      callbacks:
        on_left: "toggle_volume_menu"
        on_right: "toggle_mute"
        on_middle: "exec cmd.exe /c start ms-settings:sound"
  wifi:
    type: "yasb.wifi.WifiWidget"
    options:
      label: "<span>{wifi_icon}</span>"
      label_alt: "<span>{wifi_icon}</span>{wifi_name}"
      update_interval: 5000
      callbacks:
        on_right: "exec cmd.exe /c start ms-settings:network"
        on_middle: "do_nothing"
        on_left: "toggle_label"
      ethernet_icon: "\ueba9"
      wifi_icons: ["\udb82\udd2e", "\udb82\udd1f", "\udb82\udd22", "\udb82\udd25", "\udb82\udd28"]
